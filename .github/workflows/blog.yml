name: 블로그 새 글 가져오기

on:
  schedule:
    # 한국 시간 08:17, 13:17, 19:17 (깃허브 시간은 UTC라 9시간 뺌, 정각은 붐벼서 17분)
    - cron: "17 23,4,10 * * *"
  workflow_dispatch: # Actions 탭에서 손으로도 돌릴 수 있게

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/update_blog.py
      - name: 바뀐 게 있으면 저장하고 깃허브 페이지 다시 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          # 봇이 올린 저장이 페이지 갱신을 부르지 않는 경우가 있어 갱신을 직접 요청
          git diff --cached --quiet || { git commit -m "블로그 최근 글 갱신" && git push && gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds"; }
